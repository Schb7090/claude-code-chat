<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120" width="1000" height="1120" font-family="Georgia, 'DejaVu Serif', serif">
  <defs>
    <radialGradient id="sea" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#16324f"/>
      <stop offset="1" stop-color="#0b1a2c"/>
    </radialGradient>
    <pattern id="dune" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#d8b46a"/>
      <circle cx="3" cy="4" r="1.1" fill="#b98f45"/>
      <circle cx="10" cy="10" r="1.1" fill="#b98f45"/>
    </pattern>
    <pattern id="jungle" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#2f7a3a"/>
      <circle cx="3" cy="3" r="2.6" fill="#256b30"/>
      <circle cx="9" cy="9" r="2.6" fill="#3a8a45"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#a9895a"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#7d6137" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1000" height="1120" fill="url(#sea)"/>
  <text x="500" y="52" fill="#e8d9a8" font-size="34" text-anchor="middle" letter-spacing="6">VAELORIA</text>
  <text x="500" y="76" fill="#a9b8c9" font-size="13" text-anchor="middle">térképvázlat – a rajz (16:10) alapján, nem végleges kánon</text>

  <!-- északi szigetek -->
  <g fill="#e9eef2" stroke="#9fb3c4" stroke-width="2">
    <path d="M330 150 q18 -22 40 -6 q10 20 -12 30 q-30 6 -28 -24z"/>
    <path d="M410 120 q24 -14 38 4 q4 22 -20 26 q-22 -4 -18 -30z"/>
    <path d="M500 150 q30 -12 48 6 q-4 24 -34 24 q-20 -10 -14 -30z"/>
    <path d="M600 128 q26 -12 40 8 q-6 22 -30 22 q-14 -12 -10 -30z"/>
    <path d="M380 205 q24 -14 44 0 q2 22 -24 26 q-24 -6 -20 -26z"/>
    <path d="M470 220 q18 -10 32 4 q0 16 -20 18 q-16 -6 -12 -22z"/>
    <path d="M560 215 q26 -10 44 6 q-4 22 -30 22 q-18 -10 -14 -28z"/>
    <path d="M300 260 q14 -10 28 2 q0 14 -16 16 q-14 -6 -12 -18z"/>
    <path d="M650 250 q20 -10 34 4 q-4 18 -24 20 q-14 -8 -10 -24z"/>
  </g>

  <!-- BOREALIA -->
  <path d="M270 410 C 300 330, 380 290, 470 285 C 480 270, 484 258, 490 250 C 500 268, 506 280, 520 290 C 610 300, 690 340, 740 410 L 700 440 C 660 385, 580 345, 480 345 C 395 348, 330 385, 305 440 Z"
        fill="#dfe8ee" stroke="#9fb3c4" stroke-width="3"/>
  <text x="500" y="332" fill="#33516b" font-size="22" text-anchor="middle" letter-spacing="3">BOREALIA</text>

  <!-- KHAR-KALLOR (3. térkép alakja: hosszú vulkáni nyugati part + óriás sivatagos medence) -->
  <path d="M270 410 L 305 440 C 270 500, 262 600, 275 700 C 285 770, 320 820, 350 850 C 352 880, 330 905, 292 905 C 215 880, 160 800, 135 700 C 110 590, 140 480, 210 400 Z"
        fill="#7a2a1c" stroke="#d98a4a" stroke-width="3"/>
  <!-- óriás sivatag -->
  <path d="M262 470 C 245 560, 245 650, 262 730 C 270 780, 300 820, 322 842 C 300 760, 292 640, 296 520 Z"
        fill="url(#dune)" stroke="#e8c97a" stroke-width="2"/>
  <path d="M296 520 C 292 640, 300 760, 322 842 C 330 800, 318 700, 318 600 C 318 540, 312 500, 296 470 Z" fill="url(#dune)" opacity=".85"/>
  <text x="206" y="610" fill="#ffd9b0" font-size="22" text-anchor="middle" transform="rotate(-82 206 610)" letter-spacing="3">KHAR-KALLOR</text>
  <text x="268" y="640" fill="#4a2f08" font-size="13" text-anchor="middle" transform="rotate(-84 268 640)">óriás sivatag / sós medence</text>

  <!-- OSTRAEA -->
  <path d="M700 440 L 740 410 C 820 470, 855 570, 840 690 C 830 745, 800 790, 760 800 C 700 800, 660 795, 640 790 C 685 720, 700 600, 700 440 Z"
        fill="#7da84a" stroke="#d6e29a" stroke-width="3"/>
  <!-- Mor-Vel hasadéktó -->
  <path d="M745 470 C 770 520, 790 590, 795 665 C 790 690, 772 690, 765 668 C 752 600, 735 540, 728 490 C 730 472, 740 466, 745 470 Z"
        fill="#2f6f9f" stroke="#a9d3ee" stroke-width="2"/>
  <text x="810" y="590" fill="#0b2a3a" font-size="14" text-anchor="middle" transform="rotate(75 810 590)">Mor-Vel</text>
  <text x="770" y="620" fill="#f4ffd8" font-size="20" text-anchor="middle" letter-spacing="2" transform="rotate(80 770 620)" opacity="0">.</text><text x="718" y="395" fill="#f4ffd8" font-size="22" letter-spacing="2" transform="rotate(14 718 395)">OSTRAEA</text>
  <text x="760" y="745" fill="#f4ffd8" font-size="12" text-anchor="middle">Imperium</text><text x="760" y="760" fill="#f4ffd8" font-size="12" text-anchor="middle">Geminorum</text>

  <!-- NAMARRA (helye feltételezett: Ostraea külső, keleti partján, Velathistől víz választja el) -->
  <path d="M850 450 C 910 500, 945 600, 940 705 C 936 735, 912 738, 905 712 C 900 620, 882 540, 846 490 Z"
        fill="url(#hatch)" stroke="#e8c97a" stroke-width="3" stroke-dasharray="7 5"/>
  <text x="935" y="560" fill="#ffe9b8" font-size="16" text-anchor="middle" transform="rotate(78 935 560)" letter-spacing="2">NAMARRA ?</text>

  <!-- VELATHIS (3. térkép: dzsungel, déli nyelv) -->
  <path d="M640 790 C 700 800, 760 802, 800 790 C 835 795, 842 840, 805 900 C 760 965, 690 985, 625 950 C 565 915, 560 840, 640 790 Z"
        fill="url(#jungle)" stroke="#8fd08f" stroke-width="3"/>
  <text x="705" y="890" fill="#eaffd8" font-size="22" text-anchor="middle" letter-spacing="3">VELATHIS</text>
  <text x="705" y="912" fill="#c6ecb0" font-size="12" text-anchor="middle">dzsungel / esőerdő</text>

  <!-- hegygerinc (kék) -->
  <g fill="none" stroke="#5ab0ff" stroke-width="7" stroke-linecap="round" opacity=".9">
    <path d="M295 440 C 330 395, 400 360, 480 360 C 570 362, 640 395, 690 445"/>
    <path d="M300 460 C 280 560, 285 680, 330 800"/>
    <path d="M712 470 C 722 560, 700 660, 650 790"/>
  </g>
  <text x="480" y="380" fill="#bfe0ff" font-size="12" text-anchor="middle">hegygerinc (Spine of the Mountain)</text>

  <!-- belső tenger, szigetek, epicentrum -->
  <text x="480" y="590" fill="#6fa3cf" font-size="15" text-anchor="middle" letter-spacing="4">BELSŐ TENGER</text>
  <g fill="#c8885a" stroke="#f0b67a" stroke-width="1.5">
    <path d="M395 640 q14 -10 26 2 q0 14 -16 16 q-14 -6 -10 -18z"/>
    <path d="M455 690 q14 -8 24 4 q-2 12 -16 14 q-12 -6 -8 -18z"/>
    <path d="M350 600 q10 -8 20 2 q-2 10 -12 12 q-10 -4 -8 -14z"/>
    <path d="M540 640 q12 -8 22 2 q-2 12 -14 14 q-10 -6 -8 -16z"/>
    <path d="M420 740 q10 -6 18 2 q-2 10 -12 10 q-8 -4 -6 -12z"/>
    <path d="M520 720 q8 -6 16 2 q-2 8 -10 10 q-8 -4 -6 -12z"/>
  </g>
  <circle cx="475" cy="650" r="7" fill="#c07be0"/>
  <text x="475" y="634" fill="#d9a8ee" font-size="12" text-anchor="middle">epicentrum</text>

  <!-- nyugati sziget (spirállal) -->
  <path d="M70 770 q30 -40 80 -20 q30 40 -10 80 q-60 20 -70 -60z" fill="#c8885a" stroke="#f0b67a" stroke-width="2"/>
  <path d="M112 785 m-18 0 a18 18 0 1 1 18 18 a12 12 0 1 1 -12 -12 a6 6 0 1 1 6 6" fill="none" stroke="#5ab0ff" stroke-width="2"/>

  <!-- jelmagyarázat -->
  <g transform="translate(40 960)" font-size="12" fill="#cfd8e3">
    <rect x="-10" y="-20" width="440" height="160" fill="#0b1a2c" stroke="#35506e" rx="6"/>
    <text x="0" y="0" font-weight="bold" fill="#e8d9a8">Jelmagyarázat és állapot</text>
    <text x="0" y="22">Alap: a saját rajz (gyűrű / patkó, középen szigetek és epicentrum).</text>
    <text x="0" y="40">Khar-Kallor és Velathis alakja: a 3. térkép alapján; tó: 1. térkép (Mor-Vel).</text>
    <text x="0" y="58">Namarra: Ostraeával határos, de a HELYE FELTÉTELEZETT (szaggatott körvonal).</text>
    <text x="0" y="76">Saltwinds (déli szigetek, kvázi-főváros): nincs berajzolva, helye tisztázandó.</text>
    <text x="0" y="94">Vámpírok: nem módosítva (nincs jelölve).</text>
    <text x="0" y="112">Égtájak (É/D): a rajzodon kérdőjeles, ezért nincs iránytű.</text>
    <text x="0" y="130">Méretarány és pontos partvonal: becslés, nem mérnöki térkép.</text>
  </g>
</svg>
